name: Publish OrthoBrief

# Rebuilds the feed every morning and publishes the standalone page.
# 11:00 UTC is 07:00 US Eastern — after the overnight European issues land and
# before anyone looks. Cron on GitHub Actions is always UTC.
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}          # a "run it now" button in the Actions tab
  push:
    branches: [main]
    paths: ["app.py", "template.html", ".github/workflows/publish.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two builds publish at once; let a newer one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No pip install step: the app is standard library only.

      - name: Build the page
        env:
          # Crossref's polite pool wants a contact address. Held as a secret
          # rather than a variable so it is redacted from these public logs.
          ORTHOBRIEF_EMAIL: ${{ secrets.ORTHOBRIEF_EMAIL || 'orthobrief@users.noreply.github.com' }}
        run: >
          python3 app.py --snapshot public/index.html --public --refresh
          --feeds public/feeds

      - name: Check it actually built
        run: |
          test -s public/index.html
          python3 - <<'PY'
          import os, re, sys
          html = open("public/index.html", encoding="utf-8").read()
          size = os.path.getsize("public/index.html") / 1e6
          papers = html.count('"doi":')
          print(f"{size:.1f} MB, {papers} paper records")
          if papers < 20:
              sys.exit(f"only {papers} papers — refusing to publish a broken build")
          if '__ORTHOBRIEF_DATA__' in html:
              sys.exit("template tokens were not filled in")
          PY

      - name: Check the home-screen icons
        run: |
          python3 - <<'PY'
          import os, struct, sys
          need = {"apple-touch-icon.png": 180, "icon-192.png": 192, "icon-512.png": 512}
          for name, size in need.items():
              path = f"public/{name}"
              if not os.path.exists(path):
                  sys.exit(f"{name} was not built")
              head = open(path, "rb").read(24)
              if head[:8] != b"\x89PNG\r\n\x1a\n":
                  sys.exit(f"{name} is not a PNG")
              w, h = struct.unpack(">II", head[16:24])
              if (w, h) != (size, size):
                  sys.exit(f"{name} is {w}x{h}, expected {size}x{size}")
              print(f"{name}: {w}x{h}, {os.path.getsize(path)} bytes")
          if not os.path.exists("public/manifest.webmanifest"):
              sys.exit("no manifest")
          PY

      - name: Check the standing-query feeds
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          from email.utils import parsedate_to_datetime
          files = sorted(glob.glob("public/feeds/**/*.xml", recursive=True))
          if len(files) < 150:
              sys.exit(f"only {len(files)} feeds — expected one per field × design")
          items = 0
          for f in files:                       # a malformed feed is worse than none
              ch = ET.parse(f).getroot().find("channel")
              if ch is None or not ch.findtext("title"):
                  sys.exit(f"{f}: no channel title")
              for it in ch.findall("item"):
                  parsedate_to_datetime(it.findtext("pubDate"))   # valid RFC-822
                  if it.find("guid") is None:
                      sys.exit(f"{f}: an item with no guid would re-notify every reader")
                  items += 1
          print(f"{len(files)} feeds, {items} items, all well formed")
          if not items:
              sys.exit("every feed is empty — refusing to publish")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
